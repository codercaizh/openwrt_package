services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
    image: owrt-builder:local
    container_name: ${OWRT_WEB_CONTAINER_NAME:-owrt-builder-web}
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # The host paths are intentionally identical inside this container:
      # BuildEngine passes them to the host Docker daemon for worker mounts.
      OWRT_REPO_ROOT: ${OWRT_REPO_HOST_PATH:-${PWD}}
      # The four explicit paths keep large mutable trees away from the
      # checked-out project while retaining OWRT_DATA_HOST_PATH as a grouped
      # legacy fallback for older deployments.
      OWRT_WORKSPACE: ${OWRT_WORKSPACE_HOST_PATH:-${OWRT_DATA_HOST_PATH:-${PWD}/.owrt-web}/workspace}
      OWRT_DATA_DIR: ${OWRT_STATE_HOST_PATH:-${OWRT_DATA_HOST_PATH:-${PWD}/.owrt-web}/state}
      OWRT_ARTIFACT_DIR: ${OWRT_ARTIFACT_HOST_PATH:-${OWRT_DATA_HOST_PATH:-${PWD}/.owrt-web}/state/artifacts}
      # The web process is isolated in its own PID namespace by default.  A
      # read-only host /proc view lets the operations dashboard show the
      # machine that actually runs the builder workers.
      OWRT_HOST_PROC: /host/proc
      OWRT_BIND_HOST: 0.0.0.0
      OWRT_BIND_PORT: 8000
      OWRT_PUBLIC_ORIGIN: ${OWRT_PUBLIC_ORIGIN:-http://127.0.0.1:${OWRT_WEB_PORT:-8000}}
      OWRT_ALLOWED_ORIGINS: ${OWRT_ALLOWED_ORIGINS:-*}
      OWRT_SECURE_COOKIE: ${OWRT_SECURE_COOKIE:-0}
      OWRT_TRUST_PROXY: ${OWRT_TRUST_PROXY:-0}
      PUSHPLUS_TOKEN: ${PUSHPLUS_TOKEN:-}
      PUSHPLUS_ENDPOINT: ${PUSHPLUS_ENDPOINT:-https://www.pushplus.plus/send}
    volumes:
      - ${OWRT_REPO_HOST_PATH:-${PWD}}:${OWRT_REPO_HOST_PATH:-${PWD}}:ro
      - ${OWRT_REPO_HOST_PATH:-${PWD}}:/opt/owrt-builder:ro
      - ${OWRT_STATE_HOST_PATH:-${OWRT_DATA_HOST_PATH:-${PWD}/.owrt-web}/state}:${OWRT_STATE_HOST_PATH:-${OWRT_DATA_HOST_PATH:-${PWD}/.owrt-web}/state}:rw
      - ${OWRT_WORKSPACE_HOST_PATH:-${OWRT_DATA_HOST_PATH:-${PWD}/.owrt-web}/workspace}:${OWRT_WORKSPACE_HOST_PATH:-${OWRT_DATA_HOST_PATH:-${PWD}/.owrt-web}/workspace}:rw
      - ${OWRT_ARTIFACT_HOST_PATH:-${OWRT_DATA_HOST_PATH:-${PWD}/.owrt-web}/state/artifacts}:${OWRT_ARTIFACT_HOST_PATH:-${OWRT_DATA_HOST_PATH:-${PWD}/.owrt-web}/state/artifacts}:rw
      - /proc:/host/proc:ro
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: ${OWRT_REPO_HOST_PATH:-${PWD}}
    ports:
      - "${OWRT_WEB_BIND_ADDRESS:-0.0.0.0}:${OWRT_WEB_PORT:-8000}:8000"

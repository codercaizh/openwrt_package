[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "owrt-builder"
version = "0.1.0"
description = "Docker-backed OpenWrt firmware builder with a small authenticated Web UI"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]

[project.scripts]
owrt = "owrt_builder.cli:main"
owrt-admin = "owrt_builder.admin:main"

[tool.setuptools.packages.find]
include = ["owrt_builder*"]

[tool.setuptools.package-data]
owrt_builder = [
  "static/*.html",
  "static/*.css",
  "static/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

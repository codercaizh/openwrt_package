version = 1
# ARM devices use their own fragment, including shared armv8.config via #CONFIG_INCLUDE.
default_config = "armv8.config"

[[sources]]
id = "armv8"
url = "https://github.com/immortalwrt/immortalwrt.git"
branch = "v25.12.2"
# Official immutable release tag, not the moving 25.12 maintenance branch.
platform = "arm"

[[sources]]
id = "immortalwrt-25.12-mediatek"
url = "https://github.com/immortalwrt/immortalwrt.git"
branch = "v25.12.2"
# Pin the official release tag; both MediaTek profiles exist in v25.12.2.
platform = "mediatek"

[[sources]]
id = "immortalwrt-25.12-ramips"
url = "https://github.com/immortalwrt/immortalwrt.git"
branch = "v25.12.2"
platform = "ramips"

[[devices]]
key = "360t7"
aliases = ["360-t7", "qihoo_360t7"]
platform = "mediatek"
source = "immortalwrt-25.12-mediatek"
profile = "qihoo_360t7"
config = "360t7.config"
packager = "mediatek"
target = "mediatek/filogic"
description = "Qihoo 360T7"

[[devices]]
key = "netcore_n60-pro"
aliases = ["n60pro", "n60-pro", "netcore-n60-pro", "netcore_n60_pro"]
platform = "mediatek"
source = "immortalwrt-25.12-mediatek"
profile = "netcore_n60-pro"
config = "n60pro.config"
packager = "mediatek"
target = "mediatek/filogic"
description = "Netcore N60 Pro"

[[devices]]
key = "s905d"
aliases = ["n1"]
platform = "arm"
source = "armv8"
profile = "generic"
config = "s905d.config"
packager = "arm"
target = "armsr/armv8"
description = "Amlogic S905D / N1"

[[devices]]
key = "vplus"
aliases = ["h6-vplus"]
platform = "arm"
source = "armv8"
profile = "generic"
config = "vplus.config"
packager = "arm"
target = "armsr/armv8"
description = "H6 V-Plus"

[[devices]]
key = "r3g"
aliases = ["xiaomi-r3g", "xiaomi_r3g", "mir3g", "xiaomi_mi-router-3g"]
platform = "ramips"
source = "immortalwrt-25.12-ramips"
profile = "xiaomi_mi-router-3g"
config = "r3g.config"
packager = "ramips"
target = "ramips/mt7621"
description = "Xiaomi Mi Router 3G (R3G, NAND; not R3G v2)"

[[devices]]
key = "k2p"
aliases = ["phicomm-k2p", "phicomm_k2p", "k2p-a1", "k2p-a2"]
platform = "ramips"
source = "immortalwrt-25.12-ramips"
profile = "phicomm_k2p"
config = "k2p.config"
packager = "ramips"
target = "ramips/mt7621"
description = "Phicomm K2P A1/A2 (MediaTek; not Broadcom B1)"

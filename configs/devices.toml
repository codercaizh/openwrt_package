version = 1
# ARM devices use their own fragment, including shared armv8.config via #CONFIG_INCLUDE.
default_config = "armv8.config"

[[sources]]
id = "armv8"
url = "https://github.com/immortalwrt/immortalwrt.git"
branch = "v25.12.2"
# Official immutable release tag, not the moving 25.12 maintenance branch.
platform = "arm"

[[sources]]
id = "immortalwrt-25.12-mediatek"
url = "https://github.com/immortalwrt/immortalwrt.git"
branch = "v25.12.2"
# Pin the official release tag; both MediaTek profiles exist in v25.12.2.
platform = "mediatek"

[[devices]]
key = "360t7"
aliases = ["360-t7", "qihoo_360t7"]
platform = "mediatek"
source = "immortalwrt-25.12-mediatek"
profile = "qihoo_360t7"
config = "360t7.config"
packager = "mediatek"
target = "mediatek/filogic"
description = "Qihoo 360T7"

[[devices]]
key = "netcore_n60-pro"
aliases = ["n60pro", "n60-pro", "netcore-n60-pro", "netcore_n60_pro"]
platform = "mediatek"
source = "immortalwrt-25.12-mediatek"
profile = "netcore_n60-pro"
config = "n60pro.config"
packager = "mediatek"
target = "mediatek/filogic"
description = "Netcore N60 Pro"

[[devices]]
key = "s905d"
aliases = ["n1"]
platform = "arm"
source = "armv8"
profile = "generic"
config = "s905d.config"
packager = "arm"
target = "armsr/armv8"
description = "Amlogic S905D / N1"

[[devices]]
key = "vplus"
aliases = ["h6-vplus"]
platform = "arm"
source = "armv8"
profile = "generic"
config = "vplus.config"
packager = "arm"
target = "armsr/armv8"
description = "H6 V-Plus"

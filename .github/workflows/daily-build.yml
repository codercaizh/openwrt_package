name: Daily Firmware Matrix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    if: ${{ github.ref_name == 'codex/n60pro-immortalwrt-master' }}
    name: Firmware ${{ matrix.device }}
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        device: [360t7, n60pro, s905d, vplus, r3g, k2p, k2p-ap]
    uses: ./.github/workflows/build.yml
    with:
      device: ${{ matrix.device }}

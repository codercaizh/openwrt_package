name: Daily Firmware Matrix

on:
  schedule:
    # GitHub cron is UTC: 16:00 UTC = 00:00 Beijing time the next day.
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    name: Firmware ${{ matrix.device }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        device: [360t7, n60pro, s905d, vplus]
    uses: ./.github/workflows/build.yml
    with:
      device: ${{ matrix.device }}

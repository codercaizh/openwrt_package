name: Daily Firmware Matrix Dispatcher

on:
  schedule:
    # GitHub cron is UTC: 16:00 UTC = 00:00 Beijing time the next day.
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  dispatch-master:
    name: Dispatch matrix build to ImmortalWrt master
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch matrix workflow on master branch
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: codex/n60pro-immortalwrt-master
        run: |
          set -euo pipefail
          gh workflow run daily-build.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$TARGET_BRANCH"
          echo "Dispatched daily-build.yml to $TARGET_BRANCH"

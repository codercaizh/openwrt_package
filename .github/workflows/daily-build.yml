name: Daily Firmware Matrix

on:
  schedule:
    # GitHub cron is UTC: 15:00 UTC = 23:00 Beijing time.
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  firmware:
    if: ${{ github.repository == 'codercaizh/openwrt_package' && github.ref == 'refs/heads/immortalwrt-master' }}
    name: Firmware ${{ matrix.device }}
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        device: [360t7, n60pro, s905d, vplus, r3g, k2p, k2p-ap]
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/build.yml
    with:
      device: ${{ matrix.device }}

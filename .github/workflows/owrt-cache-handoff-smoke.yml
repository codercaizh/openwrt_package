name: Verify the OpenWrt cache handoff

on:
  push:
    branches: [immortalwrt-master]
    paths: [.github/workflows/owrt-cache-handoff-smoke.yml]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      staged_cache: ${{ steps.cache-bundle.outputs.artifact-id }}
    steps:
      - name: Create tiny handoff files
        run: |
          mkdir -p .owrt/cache/transfer
          printf '{"probe":true}' > .owrt/cache/transfer/plan.json
          printf 'cache-handoff-smoke' > .owrt/cache/transfer/toolchain.tar.zst
      - name: Hand off cache archives to the publisher
        id: cache-bundle
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-cache-handoff-smoke
          path: |
            .owrt/cache/transfer/plan.json
            .owrt/cache/transfer/*.tar.zst
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 1


  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    needs: build
    steps:
      - name: Download validated cache archives
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.staged_cache }}
          path: .owrt/cache/transfer
          merge-multiple: true

      - name: Check downloaded cache bundle
        id: check-bundle
        shell: bash
        run: |
          shopt -s nullglob
          archives=(.owrt/cache/transfer/*.tar.zst)
          if [[ ! -s .owrt/cache/transfer/plan.json || ${#archives[@]} -eq 0 ]]; then
            echo "::error::Cache bundle must contain plan.json and cache archives directly in .owrt/cache/transfer"
            exit 1
          fi

      - name: Verify file contents
        run: |
          test "$(cat .owrt/cache/transfer/plan.json)" = '{"probe":true}'
          test "$(cat .owrt/cache/transfer/toolchain.tar.zst)" = 'cache-handoff-smoke'

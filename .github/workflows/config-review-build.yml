name: Config Review Build

on:
  push:
    branches:
      - immortalwrt-master
    paths:
      - "configs/**"
      - "owrt_builder/**"
      - "tests/**"
      - ".github/workflows/build.yml"
      - ".github/workflows/owrt-firmware.yml"
      - ".github/workflows/config-review-build.yml"
  pull_request:
    branches:
      - immortalwrt-25.12.2
      - immortalwrt-master
    paths:
      - "configs/**"
      - "owrt_builder/**"
      - "tests/**"
      - ".github/workflows/build.yml"
      - ".github/workflows/owrt-firmware.yml"
      - ".github/workflows/config-review-build.yml"

concurrency:
  group: config-review-${{ github.event.pull_request.number || (contains(github.event.head_commit.message, '[verify n60pro cache]') && github.sha) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run regression tests
        run: python -m pytest

  firmware:
    if: github.event_name == 'pull_request'
    name: Firmware ${{ matrix.device }}
    needs: unit-tests
    strategy:
      fail-fast: false
      matrix:
        device: [360t7, n60pro, s905d, vplus, r3g, k2p, k2p-ap]
    uses: ./.github/workflows/owrt-firmware.yml
    with:
      device: ${{ matrix.device }}

  cache-cold:
    if: github.event_name == 'push' && github.ref == 'refs/heads/immortalwrt-master' && contains(github.event.head_commit.message, '[verify n60pro cache]')
    needs: unit-tests
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/build.yml
    with:
      device: n60pro
      validation: -cold

  cache-warm:
    if: needs.cache-cold.outputs.upstream != '' && needs.cache-cold.outputs.feed_pins != ''
    needs: cache-cold
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/build.yml
    with:
      device: n60pro
      validation: -warm
      upstream: ${{ needs.cache-cold.outputs.upstream }}
      feed_pins: ${{ needs.cache-cold.outputs.feed_pins }}

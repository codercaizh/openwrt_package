name: Config Review Build

on:
  pull_request:
    branches:
      - immortalwrt-25.12.2
    paths:
      - "configs/**"
      - "owrt_builder/**"
      - "tests/**"
      - ".github/workflows/build.yml"
      - ".github/workflows/config-review-build.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run regression tests
        run: python -m pytest

  firmware:
    name: Firmware ${{ matrix.device }}
    needs: unit-tests
    strategy:
      fail-fast: false
      matrix:
        device: [360t7, s905d, vplus]
    uses: ./.github/workflows/build.yml
    with:
      device: ${{ matrix.device }}

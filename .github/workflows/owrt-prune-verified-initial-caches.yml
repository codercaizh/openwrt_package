name: Prune three superseded v3 OpenWrt caches

on:
  push:
    branches: [immortalwrt-master]
    paths: [.github/workflows/owrt-prune-verified-initial-caches.yml]

permissions: {}

jobs:
  prune:
    if: >-
      github.repository == 'codercaizh/openwrt_package' &&
      github.event.head_commit.message == 'ci: prune OpenWrt caches replaced in the validated N60 Pro run'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Keep the four cache IDs used by the successful warm build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY/actions/caches"
          ref=refs/heads/immortalwrt-master
          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/133747267840" |
            jq -e '.conclusion == "success" and any(.steps[]; (.name | startswith("Verify the second")) and .conclusion == "success")'
          inventory="$(gh api --method GET "$api" -f "ref=$ref" -F per_page=100)"
          jq -e --arg ref "$ref" --argjson keepers '[10636186943,10636210793,10616830401,10630757237]' \
            '. as $inventory | all($keepers[]; . as $id | any($inventory.actions_caches[]; .ref == $ref and .id == $id and .size_in_bytes > 0))' <<< "$inventory"

          legacy=(
            '10616920447|owrt-source-v3-linux-x64-immortalwrt-master-mediatek-'
            '10630698424|owrt-host-v3-linux-x64-master-'
            '10616898873|owrt-toolchain-v3-linux-x64-netcore_n60-pro-'
          )
          for entry in "${legacy[@]}"; do
            IFS='|' read -r id prefix <<< "$entry"
            if jq -e --arg ref "$ref" --arg prefix "$prefix" --argjson id "$id" \
              'any(.actions_caches[]; .ref == $ref and .id == $id and (.key | startswith($prefix)))' <<< "$inventory"; then
              gh api --method DELETE "$api/$id"
              printf 'Deleted superseded cache %s\n' "$id"
            fi
          done

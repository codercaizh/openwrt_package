name: Prune replaced OpenWrt caches

on:
  workflow_call:
  workflow_run:
    workflows: [OpenWrt Build, Config Review Build]
    branches: [immortalwrt-master]
    types: [completed]

permissions: {}

jobs:
  prune:
    if: >-
      github.repository == 'codercaizh/openwrt_package' &&
      github.ref == 'refs/heads/immortalwrt-master' &&
      vars.OWRT_DISABLE_V3_CACHE != '1' &&
      (
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.head_repository.full_name == github.repository &&
         github.event.workflow_run.head_branch == 'immortalwrt-master' &&
         github.event.workflow_run.conclusion == 'success' &&
         contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event.workflow_run.event)) ||
        (github.workflow_ref == format('{0}/.github/workflows/daily-build.yml@refs/heads/immortalwrt-master', github.repository) &&
         contains(fromJSON('["schedule","workflow_dispatch"]'), github.event_name))
      )
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    concurrency:
      group: owrt-master-cache-writes
      queue: max
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/immortalwrt-master
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prune caches superseded by confirmed uploads
        env:
          GH_TOKEN: ${{ github.token }}
          OWRT_PUBLISH_RUN: ${{ github.event.workflow_run.id || github.run_id }}
          OWRT_PUBLISH_ATTEMPT: ${{ github.event.workflow_run.run_attempt || github.run_attempt }}
          OWRT_PUBLISH_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          prefix="openwrt-cache-publications-$OWRT_PUBLISH_ATTEMPT-"
          names="$(gh api --method GET --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$OWRT_PUBLISH_RUN/artifacts" \
            -F per_page=100 --jq '.artifacts[] | select(.expired == false) | .name')"
          if [[ "$names" != *"$prefix"* ]]; then
            echo "No confirmed cache uploads for this build."
            exit 0
          fi
          records="$(mktemp -d "$RUNNER_TEMP/owrt-publications.XXXXXXXX")"
          gh run download "$OWRT_PUBLISH_RUN" --repo "$GITHUB_REPOSITORY" --pattern "$prefix*" --dir "$records"
          python -m owrt_builder.ci_cache prune "$records"

name: Prune the superseded MediaTek source cache

on:
  push:
    branches: [immortalwrt-master]
    paths: [.github/workflows/owrt-prune-matrix-cache-once.yml]

permissions: {}

jobs:
  prune:
    if: >-
      github.repository == 'codercaizh/openwrt_package' &&
      github.event.head_commit.message == 'ci: remove MediaTek source cache replaced by the completed matrix'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify the completed matrix and its replacement before removing the old entry
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY/actions"
          ref=refs/heads/immortalwrt-master
          scope=owrt-source-v3-linux-x64-immortalwrt-master-mediatek-
          sha=eb87cb3684bc028b58430ced83e5e0f102df1b13
          gh api "$api/runs/44013997141" |
            jq -e --arg sha "$sha" '.conclusion == "success" and .head_sha == $sha and .head_branch == "immortalwrt-master"'
          inventory="$(gh api --method GET "$api/caches" -f "ref=$ref" -f "key=$scope" -F per_page=100)"
          jq -e --arg ref "$ref" --arg prefix "$scope$sha-" \
            'any(.actions_caches[]; .id == 10644323971 and .ref == $ref and .size_in_bytes > 0 and (.key | startswith($prefix)))' <<< "$inventory"
          if jq -e --arg ref "$ref" --arg prefix "${scope}c37359bd8f3243ad641da3a7e5548e30941b41bd-" \
            'any(.actions_caches[]; .id == 10636186943 and .ref == $ref and (.key | startswith($prefix)))' <<< "$inventory"; then
            gh api --method DELETE "$api/caches/10636186943"
            echo "Removed 10636186943, kept verified replacement 10644323971."
          fi

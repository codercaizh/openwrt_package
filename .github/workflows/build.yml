name: OpenWrt Build

on:
  workflow_dispatch:
    inputs:
      device:
        description: Supported device key or alias
        required: true
        type: choice
        options:
          - 360t7
          - n60pro
          - s905d
          - vplus
          - r3g
          - k2p
          - k2p-ap
        default: n60pro
  workflow_call:
    inputs:
      device:
        description: Supported device key or alias
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: build-${{ inputs.device || github.event.inputs.device }}
    runs-on: ubuntu-22.04
    # GitHub-hosted runners cap a job at six hours.  Use a self-hosted runner
    # for a larger feed/plugin set that needs more time.
    timeout-minutes: 360
    steps:
      - name: Check out builder
        uses: actions/checkout@v4

      # The upstream branch determines the host-tool ABI: master uses LLVM 22.1.3,
      # while v25.12.2 uses LLVM 21.1.6. Share only these host tools across devices
      # on the same source branch; target toolchains remain device-specific.
      - name: Choose cache scopes
        id: cache_scope
        env:
          DEVICE: ${{ inputs.device || github.event.inputs.device }}
        run: |
          case "$DEVICE" in
            n60pro) canonical=netcore_n60-pro; host_scope=master; llvm_version=22.1.3 ;;
            360t7) canonical=360t7; host_scope=v25.12.2; llvm_version=21.1.6 ;;
            s905d) canonical=s905d; host_scope=v25.12.2; llvm_version=21.1.6 ;;
            vplus) canonical=vplus; host_scope=v25.12.2; llvm_version=21.1.6 ;;
            r3g) canonical=r3g; host_scope=v25.12.2; llvm_version=21.1.6 ;;
            k2p) canonical=k2p; host_scope=v25.12.2; llvm_version=21.1.6 ;;
            k2p-ap) canonical=k2p-ap; host_scope=v25.12.2; llvm_version=21.1.6 ;;
            *) echo "Unsupported cache device: $DEVICE" >&2; exit 1 ;;
          esac
          echo "canonical=$canonical" >> "$GITHUB_OUTPUT"
          echo "host_scope=$host_scope" >> "$GITHUB_OUTPUT"
          echo "llvm_version=$llvm_version" >> "$GITHUB_OUTPUT"
          # Bump this epoch when the LLVM build options or host compiler image changes.
          echo "host_revision=llvm-$llvm_version-v1" >> "$GITHUB_OUTPUT"
          # Device toolchain caches rotate weekly; previous weeks remain fallbacks.
          echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Restore shared host tools cache
        id: host_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .owrt/cache/host-tools/${{ steps.cache_scope.outputs.host_scope }}/build_dir/host
            .owrt/cache/host-tools/${{ steps.cache_scope.outputs.host_scope }}/staging_dir/host
          key: owrt-host-v2-${{ runner.os }}-${{ steps.cache_scope.outputs.host_scope }}-${{ steps.cache_scope.outputs.host_revision }}
          restore-keys: |
            owrt-host-v2-${{ runner.os }}-${{ steps.cache_scope.outputs.host_scope }}-

      - name: Restore device cross-toolchain cache
        uses: actions/cache@v4
        with:
          path: |
            .owrt/cache/builds/${{ steps.cache_scope.outputs.canonical }}/cache.json
            .owrt/cache/builds/${{ steps.cache_scope.outputs.canonical }}/openwrt/build_dir/hostpkg
            .owrt/cache/builds/${{ steps.cache_scope.outputs.canonical }}/openwrt/build_dir/toolchain-*
            .owrt/cache/builds/${{ steps.cache_scope.outputs.canonical }}/openwrt/staging_dir/hostpkg
            .owrt/cache/builds/${{ steps.cache_scope.outputs.canonical }}/openwrt/staging_dir/toolchain-*
          key: owrt-toolchain-v2-${{ runner.os }}-${{ steps.cache_scope.outputs.host_scope }}-${{ steps.cache_scope.outputs.canonical }}-${{ steps.cache_scope.outputs.week }}
          restore-keys: |
            owrt-toolchain-v2-${{ runner.os }}-${{ steps.cache_scope.outputs.host_scope }}-${{ steps.cache_scope.outputs.canonical }}-

      # The full dl cache is several GiB per family and competes with compiled
      # toolchain caches under GitHub's default storage quota. Keep the costly
      # LLVM source archive, but let smaller package archives download normally.
      - name: Restore LLVM source archive
        uses: actions/cache@v4
        with:
          path: .owrt/cache/dl/llvm-project-${{ steps.cache_scope.outputs.llvm_version }}.src.tar.xz
          key: owrt-llvm-source-v1-${{ runner.os }}-${{ steps.cache_scope.outputs.llvm_version }}

      - name: Check Docker and builder catalog
        run: |
          docker version
          ./owrt doctor --json

      - name: Build firmware
        env:
          OWRT_DEVICE: ${{ inputs.device || github.event.inputs.device }}
        run: |
          set -o pipefail
          ./owrt build "$OWRT_DEVICE" 2>&1 | tee "owrt-${OWRT_DEVICE}.log"

      # Only the representative device for each source branch writes the
      # shared host cache. This avoids matrix races and guarantees the saved
      # cache comes from a full toolchain build rather than a minimal AP job.
      - name: Save shared host tools cache
        if: success() && steps.host_cache.outputs.cache-hit != 'true' && (steps.cache_scope.outputs.canonical == 'netcore_n60-pro' || steps.cache_scope.outputs.canonical == '360t7')
        uses: actions/cache/save@v4
        with:
          path: |
            .owrt/cache/host-tools/${{ steps.cache_scope.outputs.host_scope }}/build_dir/host
            .owrt/cache/host-tools/${{ steps.cache_scope.outputs.host_scope }}/staging_dir/host
          key: owrt-host-v2-${{ runner.os }}-${{ steps.cache_scope.outputs.host_scope }}-${{ steps.cache_scope.outputs.host_revision }}

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ inputs.device || github.event.inputs.device }}-${{ github.run_id }}
          # BuildEngine stores artifacts under the canonical device key, so
          # aliases such as n60pro must not narrow this glob.
          # Keep the per-build APK/IPK archive in its own downloadable artifact.
          # Exclude the old basename too if a reused workspace contains a
          # legacy archive from a build before the neutral naming change.
          path: |
            .owrt/artifacts/**/*
            !.owrt/artifacts/**/packages.tar.gz
            !.owrt/artifacts/**/ipk-packages.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Upload APK/IPK package archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-packages-${{ inputs.device || github.event.inputs.device }}-${{ github.run_id }}
          # BuildEngine emits this stable basename inside the canonical
          # device/task directory.  Upload it independently so users can
          # download APK/IPK packages without the firmware bundle.
          # A pre-existing task directory may still contain the legacy
          # archive. Keep it downloadable without generating that name.
          path: |
            .owrt/artifacts/**/packages.tar.gz
            .owrt/artifacts/**/ipk-packages.tar.gz
          if-no-files-found: warn
          retention-days: 7

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-evidence-${{ inputs.device || github.event.inputs.device }}-${{ github.run_id }}
          path: |
            .owrt/tasks/**/result.json
            owrt-${{ inputs.device || github.event.inputs.device }}.log
          if-no-files-found: warn
          retention-days: 7

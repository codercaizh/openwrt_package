name: OpenWrt Build

on:
  workflow_dispatch:
    inputs:
      device:
        description: Supported device key or alias
        required: true
        type: choice
        options:
          - 360t7
          - n60pro
          - s905d
          - vplus
        default: n60pro
  workflow_call:
    inputs:
      device:
        description: Supported device key or alias
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: build-${{ inputs.device || github.event.inputs.device }}
    runs-on: ubuntu-22.04
    # GitHub-hosted runners cap a job at six hours.  Use a self-hosted runner
    # for a larger feed/plugin set that needs more time.
    timeout-minutes: 360
    steps:
      - name: Check out builder
        uses: actions/checkout@v4

      - name: Check Docker and builder catalog
        run: |
          docker version
          ./owrt doctor --json

      - name: Build firmware
        env:
          OWRT_DEVICE: ${{ inputs.device || github.event.inputs.device }}
        run: |
          set -o pipefail
          ./owrt build "$OWRT_DEVICE" 2>&1 | tee "owrt-${OWRT_DEVICE}.log"

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ inputs.device || github.event.inputs.device }}-${{ github.run_id }}
          # BuildEngine stores artifacts under the canonical device key, so
          # aliases such as n60pro must not narrow this glob.
          # Keep the per-build APK/IPK archive in its own downloadable artifact.
          # Exclude the old basename too if a reused workspace contains a
          # legacy archive from a build before the neutral naming change.
          path: |
            .owrt/artifacts/**/*
            !.owrt/artifacts/**/packages.tar.gz
            !.owrt/artifacts/**/ipk-packages.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Upload APK/IPK package archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-packages-${{ inputs.device || github.event.inputs.device }}-${{ github.run_id }}
          # BuildEngine emits this stable basename inside the canonical
          # device/task directory.  Upload it independently so users can
          # download APK/IPK packages without the firmware bundle.
          # A pre-existing task directory may still contain the legacy
          # archive. Keep it downloadable without generating that name.
          path: |
            .owrt/artifacts/**/packages.tar.gz
            .owrt/artifacts/**/ipk-packages.tar.gz
          if-no-files-found: warn
          retention-days: 7

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-evidence-${{ inputs.device || github.event.inputs.device }}-${{ github.run_id }}
          path: |
            .owrt/tasks/**/result.json
            owrt-${{ inputs.device || github.event.inputs.device }}.log
          if-no-files-found: warn
          retention-days: 7

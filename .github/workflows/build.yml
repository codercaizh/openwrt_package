name: OpenWrt Build

on:
  workflow_dispatch:
    inputs:
      device:
        description: Supported device key or alias
        required: true
        type: choice
        options:
          - 360t7
          - n60pro
          - s905d
          - vplus
          - r3g
          - k2p
          - k2p-ap
        default: n60pro
  workflow_call:
    inputs:
      device:
        description: Supported device key or alias
        required: true
        type: string
      upstream:
        description: Upstream commit from the first validation runner
        type: string
      feed_pins:
        description: Feed commits from the first validation runner
        type: string
      validation:
        description: Artifact suffix for the two-run cache validation
        type: string
    outputs:
      upstream:
        value: ${{ jobs.build.outputs.upstream }}
      feed_pins:
        value: ${{ jobs.build.outputs.feed_pins }}

permissions:
  contents: read
  actions: read

jobs:
  build:
    uses: ./.github/workflows/owrt-firmware.yml
    with:
      device: ${{ inputs.device }}
      upstream: ${{ inputs.upstream }}
      feed_pins: ${{ inputs.feed_pins }}
      validation: ${{ inputs.validation }}

  publish:
    name: Publish caches for ${{ inputs.device }}${{ inputs.validation }}
    needs: build
    if: >-
      needs.build.outputs.staged_cache != '' &&
      github.repository == 'codercaizh/openwrt_package' &&
      github.ref == 'refs/heads/immortalwrt-master' &&
      contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) &&
      vars.OWRT_DISABLE_V3_CACHE != '1'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    concurrency:
      group: owrt-master-cache-writes
      queue: max
    env:
      GH_TOKEN: ${{ github.token }}
      OWRT_CACHE_BUDGET_MIB: ${{ vars.OWRT_CACHE_BUDGET_MIB }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download validated cache archives
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.staged_cache }}
          path: .owrt/cache/transfer
          merge-multiple: true

      - name: Check downloaded cache bundle
        id: check-bundle
        shell: bash
        run: |
          shopt -s nullglob
          archives=(.owrt/cache/transfer/*.tar.zst)
          if [[ ! -s .owrt/cache/transfer/plan.json || ${#archives[@]} -eq 0 ]]; then
            echo "::error::Cache bundle must contain plan.json and cache archives directly in .owrt/cache/transfer"
            exit 1
          fi

      - name: Publish device toolchain
        uses: ./.github/actions/owrt-cache-save
        with:
          family: toolchain

      - name: Publish Host tools
        if: ${{ !cancelled() && steps.check-bundle.outcome == 'success' }}
        uses: ./.github/actions/owrt-cache-save
        with:
          family: host

      - name: Publish shared downloads
        if: ${{ !cancelled() && steps.check-bundle.outcome == 'success' }}
        uses: ./.github/actions/owrt-cache-save
        with:
          family: dl

      - name: Publish source workspace
        if: ${{ !cancelled() && steps.check-bundle.outcome == 'success' }}
        uses: ./.github/actions/owrt-cache-save
        with:
          family: source

      - name: Remove temporary cache archives
        env:
          CACHE_ARTIFACT_ID: ${{ needs.build.outputs.staged_cache }}
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$CACHE_ARTIFACT_ID"

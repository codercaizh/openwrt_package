name: OpenWrt Build

on:
  workflow_dispatch:
    inputs:
      device:
        description: Supported device key or alias
        required: true
        type: choice
        options:
          - 360t7
          - n60pro
          - s905d
          - vplus
          - r3g
          - k2p
          - k2p-ap
        default: n60pro
  workflow_call:
    inputs:
      device:
        description: Supported device key or alias
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: build-${{ inputs.device || github.event.inputs.device }}
    runs-on: ubuntu-22.04
    # GitHub-hosted runners cap a job at six hours.  Use a self-hosted runner
    # for a larger feed/plugin set that needs more time.
    timeout-minutes: 360
    steps:
      - name: Check out builder
        uses: actions/checkout@v4

      # Cache tools/* build state (including tools/llvm-bpf's LLVM/Clang/LLD
      # under build_dir/host and staged LLVM binaries/stamps under
      # staging_dir/host) and the cross-toolchain, but not target packages or
      # firmware images. GitHub cache keys are immutable once created.
      - name: Choose cache scopes
        id: cache_scope
        env:
          DEVICE: ${{ inputs.device || github.event.inputs.device }}
        run: |
          case "$DEVICE" in
            n60pro) canonical=netcore_n60-pro; family=filogic ;;
            360t7) canonical=360t7; family=filogic ;;
            s905d) canonical=s905d; family=armv8 ;;
            vplus) canonical=vplus; family=armv8 ;;
            r3g) canonical=r3g; family=mt7621 ;;
            k2p) canonical=k2p; family=mt7621 ;;
            k2p-ap) canonical=k2p-ap; family=mt7621 ;;
            *) echo "Unsupported cache device: $DEVICE" >&2; exit 1 ;;
          esac
          echo "canonical=$canonical" >> "$GITHUB_OUTPUT"
          echo "family=$family" >> "$GITHUB_OUTPUT"
          # Refresh Filogic host-tool snapshots once: the original v1 weekly
          # cache cannot capture an LLVM/BPF build that finished after its
          # first upload. Restore v1 as a fallback to avoid a cold rebuild.
          if [[ "$family" == "filogic" ]]; then
            echo "host_cache_version=v2" >> "$GITHUB_OUTPUT"
          else
            echo "host_cache_version=v1" >> "$GITHUB_OUTPUT"
          fi
          # Weekly rolling keys limit cache growth. Previous weeks are fallbacks.
          echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Restore host tools and cross-toolchain cache
        uses: actions/cache@v4
        with:
          path: |
            .owrt/cache/builds/${{ steps.cache_scope.outputs.canonical }}/cache.json
            .owrt/cache/builds/${{ steps.cache_scope.outputs.canonical }}/openwrt/build_dir/host*
            .owrt/cache/builds/${{ steps.cache_scope.outputs.canonical }}/openwrt/build_dir/toolchain-*
            .owrt/cache/builds/${{ steps.cache_scope.outputs.canonical }}/openwrt/staging_dir/host*
            .owrt/cache/builds/${{ steps.cache_scope.outputs.canonical }}/openwrt/staging_dir/toolchain-*
          key: owrt-tools-${{ steps.cache_scope.outputs.host_cache_version }}-${{ runner.os }}-${{ github.ref_name }}-${{ steps.cache_scope.outputs.canonical }}-${{ steps.cache_scope.outputs.week }}
          restore-keys: |
            owrt-tools-${{ steps.cache_scope.outputs.host_cache_version }}-${{ runner.os }}-${{ github.ref_name }}-${{ steps.cache_scope.outputs.canonical }}-
            owrt-tools-v1-${{ runner.os }}-${{ github.ref_name }}-${{ steps.cache_scope.outputs.canonical }}-

      - name: Restore downloaded source archives
        uses: actions/cache@v4
        with:
          path: .owrt/cache/dl
          key: owrt-dl-v1-${{ runner.os }}-${{ github.ref_name }}-${{ steps.cache_scope.outputs.family }}-${{ steps.cache_scope.outputs.week }}
          restore-keys: |
            owrt-dl-v1-${{ runner.os }}-${{ github.ref_name }}-${{ steps.cache_scope.outputs.family }}-

      # Merely seeing "tools/llvm-bpf compile" in OpenWrt's dependency plan
      # does not prove it rebuilt. Report the actual restored .built/.installed
      # markers so we can distinguish reused LLVM from a full host rebuild.
      - name: Inspect LLVM/BPF host cache markers
        if: ${{ steps.cache_scope.outputs.family == 'filogic' }}
        env:
          CANONICAL: ${{ steps.cache_scope.outputs.canonical }}
        run: |
          set -euo pipefail
          tree=".owrt/cache/builds/$CANONICAL/openwrt"
          shopt -s nullglob
          found=0
          for llvm in "$tree"/build_dir/host/llvm-project-*.src; do
            [[ -d "$llvm" ]] || continue
            found=1
            if [[ -f "$llvm/.built" ]]; then
              echo "LLVM/BPF host compile marker restored: $llvm/.built"
            else
              echo "LLVM/BPF build directory exists without .built marker: $llvm"
            fi
          done
          if [[ "$found" == 0 ]]; then
            echo "No cached LLVM/BPF host build directory"
          fi
          if [[ -f "$tree/staging_dir/host/stamp/.llvm-project_installed" ]]; then
            echo "LLVM/BPF host installed marker restored"
          else
            echo "No cached LLVM/BPF host installed marker"
          fi
          if [[ -e "$tree/staging_dir/host/llvm-bpf/.llvm-version" ]]; then
            echo "LLVM/BPF installed version: $(cat "$tree/staging_dir/host/llvm-bpf/.llvm-version")"
          fi

      - name: Check Docker and builder catalog
        run: |
          docker version
          ./owrt doctor --json

      - name: Build firmware
        env:
          OWRT_DEVICE: ${{ inputs.device || github.event.inputs.device }}
        run: |
          set -o pipefail
          ./owrt build "$OWRT_DEVICE" 2>&1 | tee "owrt-${OWRT_DEVICE}.log"

      # ARM packagers run as container root (mount/loop setup), leaving 0600
      # files in cargo/rustc downloads and hostpkg/staging output. The
      # actions/cache post-job tar runs as the ordinary runner and otherwise
      # fails with "Cannot open: Permission denied", silently losing both
      # caches. Repair only the paths archived by actions/cache, after the
      # worker has finished writing and before its post-job save.
      - name: Make ARMv8 caches readable for post-job save
        if: ${{ success() && steps.cache_scope.outputs.family == 'armv8' }}
        env:
          CANONICAL: ${{ steps.cache_scope.outputs.canonical }}
        run: |
          set -euo pipefail
          base=".owrt/cache/builds/$CANONICAL"
          tree="$base/openwrt"
          for parent in .owrt .owrt/cache .owrt/cache/builds "$base" "$tree" "$tree/build_dir" "$tree/staging_dir"; do
            if [[ -d "$parent" && ! -L "$parent" ]]; then
              sudo chmod a+rx -- "$parent"
            fi
          done
          shopt -s nullglob
          archived=(.owrt/cache/dl "$base/cache.json"
            "$tree"/build_dir/host* "$tree"/build_dir/toolchain-*
            "$tree"/staging_dir/host* "$tree"/staging_dir/toolchain-*)
          for path in "${archived[@]}"; do
            if [[ -d "$path" && ! -L "$path" ]]; then
              sudo chmod -R a+rX -- "$path"
            elif [[ -f "$path" ]]; then
              sudo chmod a+r -- "$path"
            fi
          done
          echo "ARMv8 cache archive permissions normalized"

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ inputs.device || github.event.inputs.device }}-${{ github.run_id }}
          # BuildEngine stores artifacts under the canonical device key, so
          # aliases such as n60pro must not narrow this glob.
          # Keep the per-build APK/IPK archive in its own downloadable artifact.
          # Exclude the old basename too if a reused workspace contains a
          # legacy archive from a build before the neutral naming change.
          path: |
            .owrt/artifacts/**/*
            !.owrt/artifacts/**/packages.tar.gz
            !.owrt/artifacts/**/ipk-packages.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Upload APK/IPK package archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-packages-${{ inputs.device || github.event.inputs.device }}-${{ github.run_id }}
          # BuildEngine emits this stable basename inside the canonical
          # device/task directory.  Upload it independently so users can
          # download APK/IPK packages without the firmware bundle.
          # A pre-existing task directory may still contain the legacy
          # archive. Keep it downloadable without generating that name.
          path: |
            .owrt/artifacts/**/packages.tar.gz
            .owrt/artifacts/**/ipk-packages.tar.gz
          if-no-files-found: warn
          retention-days: 7

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-evidence-${{ inputs.device || github.event.inputs.device }}-${{ github.run_id }}
          path: |
            .owrt/tasks/**/result.json
            owrt-${{ inputs.device || github.event.inputs.device }}.log
          if-no-files-found: warn
          retention-days: 7

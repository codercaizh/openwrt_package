name: Build OpenWrt / ImmortalWrt Firmware

on:
  workflow_dispatch:
    inputs:
      target:
        description: "编译目标平台"
        required: true
        default: "immortalwrt"
        type: choice
        options:
          - openwrt
          - immortalwrt
      device:
        description: "设备名（如: r66s, x86, 360t7, n60pro）"
        required: true
        type: string
      config:
        description: "配置文件名（不含 .config 后缀，如: armv8, 360t7）"
        required: true
        type: string
      only_package:
        description: "仅打包（跳过编译）"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set Build Image
        id: image
        run: |
          if [ "${{ github.event.inputs.target }}" = "openwrt" ]; then
            echo "image=codercai/openwrt_package:2.0" >> $GITHUB_OUTPUT
          else
            echo "image=codercai/immortalwrt_package:2.1" >> $GITHUB_OUTPUT
          fi

      - name: Prepare Build Directories
        run: |
          mkdir -p openwrt_build_tmp/{openwrt,packit,kernel,artifact}
          echo "BUILD_DIR=$PWD/openwrt_build_tmp" >> $GITHUB_ENV

      - name: Run Build in Docker
        run: |
          BUILD_IMAGE="${{ steps.image.outputs.image }}"
          TARGET="${{ github.event.inputs.target }}"
          DEVICE="${{ github.event.inputs.device }}"
          CONFIG="${{ github.event.inputs.config }}"
          ONLY_PACKAGE="${{ github.event.inputs.only_package }}"

          DOCKER_ARGS=(
            -v $BUILD_DIR/openwrt:/opt/openwrt
            -v $BUILD_DIR/packit:/opt/openwrt_packit
            -v $BUILD_DIR/kernel:/opt/kernel
            -v $PWD/configs:/opt/configs
            -v $PWD/scripts:/opt/scripts
            -v $BUILD_DIR/artifact:/opt/artifact
            --net=host
            --privileged
            --name openwrt_ci_build
          )

          docker rm -f openwrt_ci_build 2>/dev/null || true

          if [ "$ONLY_PACKAGE" = "true" ]; then
            OP="package"
          else
            OP="compile"
          fi

          echo "=========================================="
          echo "  平台: $TARGET"
          echo "  设备: $DEVICE"
          echo "  配置: $CONFIG"
          echo "  操作: $OP"
          echo "  镜像: $BUILD_IMAGE"
          echo "=========================================="

          docker run -d "${DOCKER_ARGS[@]}" "$BUILD_IMAGE" \
            /opt/scripts/build.py "$OP" "$DEVICE" "$CONFIG" "$TARGET"

          docker logs -f openwrt_ci_build

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.event.inputs.device }}-${{ github.event.inputs.target }}
          path: openwrt_build_tmp/artifact/${{ github.event.inputs.device }}/*.7z
          if-no-files-found: warn

      - name: Cleanup Container
        if: always()
        run: docker rm -f openwrt_ci_build 2>/dev/null || true
